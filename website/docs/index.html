<!DOCTYPE html>
<html lang="en">
<head>
  <title>Shiden — Documentation</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="modulepreload" href="/script.js">
  <link rel="modulepreload" href="/docs/docs.js">
  <link rel="prefetch" href="/header.html">
  <link rel="prefetch" href="/footer.html">
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shiden is a high-performance compiled language with Rust-like syntax. Learn how to build fast, efficient software with Shiden.">
  <meta name="keywords" content="Shiden programming language, Shiden, Shiden compiler, Rust-like language, compiled language, high performance programming, Shiden documentation">
  <meta name="author" content="Shiden Contributors">
  <link rel="canonical" href="https://shiden.arson.dev/docs/">
  <meta property="og:title" content="Shiden — High-Performance Programming Language">
  <meta property="og:description" content="Shiden is a compiled language with Rust-like syntax, designed for speed and efficiency. Learn how to build fast, efficient software with Shiden.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shiden.arson.dev/docs/">
  <meta property="og:image" content="https://shiden.arson.dev/assets/shiden-social.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shiden — High-Performance Programming Language">
  <meta name="twitter:description" content="Shiden is a compiled language with Rust-like syntax, designed for speed and efficiency. Learn how to build fast, efficient software with Shiden.">

</head>
<body>
  <div id="site-header"></div>
  <script type="module" src="/script.js"></script>

  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Shiden Docs',
      repo: 'https://github.com/idiotstudios/shiden/docs',
      loadNavbar: true,
      subMaxLevel: 3,
      basePath: 'https://github.com/idiotstudios/shiden/docs',
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>

  <div id="site-footer"></div>
  <script type="module" src="/docs/docs.js"></script>
  <script>
    // Hide Hack Club banner on docs page
    const observer = new MutationObserver(() => {
      const banner = document.getElementById('hack-club-banner');
      if (banner) {
        banner.style.display = 'none';
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
