[meta]
name = linux-x86
protocol_version = 1
description = Linux x86_64 target templates

[target]
triple = x86_64-pc-linux-gnu
word_bits = 64
pointer_bits = 64
endianness = little

[abi]
stack_growth = down
return_register = rax
arg_registers = rdi,rsi,rdx,rcx,r8,r9

[sections]
default_section_order = text,data,bss

[encodings]
MOV_REG_IMM = opcode=0xB8 + reg:4 + imm:32_le
ADD_REG_REG = opcode=0x01 + modrm:{reg},{rm}

[headers]
elf_class = 2
endianness = little

[props]
relocations = yes
pic = optional
; linux-x86.ini - Complete target description for linux-x86 (LowShiden)
[meta]
name = linux-x86
protocol_version = 1
description = Linux x86_64 target templates for LowShiden

[target]
triple = x86_64-pc-linux-gnu
word_bits = 64
pointer_bits = 64
endianness = little

[registers]
; canonical register names used by backends and emit templates
general = rax,rbx,rcx,rdx,rsi,rdi,rbp,rsp,r8,r9,r10,r11,r12,r13,r14,r15
return = rax
arg_order = rdi,rsi,rdx,rcx,r8,r9

[abi]
stack_growth = down
red_zone = 128

[sections]
default_section_order = text,data,bss
text_section = .text
data_section = .data
bss_section = .bss

[encodings]
; Encoding templates used by the emitter. Simple placeholders are
; interpreted by the backend: {reg}, {rm}, {imm:<bits>}_le, modrm:{reg},{rm}
MOV_REG_IMM = opcode=0xB8 + reg:{reg} + imm:32_le
ADD_REG_REG = opcode=0x01 + modrm:{reg},{rm}

[headers]
elf_class = 2
endianness = little
os_abi = 0
abi_version = 0

[props]
relocations = yes
pic = optional
dynamic_linking = yes

[notes]
; This INI is a template. Backends should treat encoding templates as helpers
; and validate values. For different target versions, add separate INI files
; under `compiler/src/targets/` named accordingly (e.g., linux-x86-v2.ini).
