[meta]
name = linux-x86
protocol_version = 1
description = Linux x86_64 target templates

[target]
triple = x86_64-pc-linux-gnu
word_bits = 64
pointer_bits = 64
endianness = little

[abi]
stack_growth = down
return_register = rax
arg_registers = rdi,rsi,rdx,rcx,r8,r9

[sections]
default_section_order = text,data,bss

[encodings]
# Simple encoding templates using placeholders {reg},{imm:<bits>}_le
MOV_REG_IMM = opcode=0xB8 + reg:4 + imm:32_le
ADD_REG_REG = opcode=0x01 + modrm:{reg},{rm}

[headers]
# Minimal ELF-like header template fields (backend interprets these)
elf_class = 2
endianness = little

[props]
relocations = yes
pic = optional
