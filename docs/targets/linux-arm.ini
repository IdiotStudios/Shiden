[meta]
name = linux-arm
protocol_version = 1
description = Linux AArch64 target templates

[target]
triple = aarch64-unknown-linux-gnu
word_bits = 64
pointer_bits = 64
endianness = little

[abi]
stack_growth = down
return_register = x0
arg_registers = x0,x1,x2,x3,x4,x5

[sections]
default_section_order = text,data,bss

[encodings]
# Example template placeholders: opcode and field placements
MOV_REG_IMM = opcode=0xD2800000 + imm:16_le + rd:5
ADD_REG_REG = opcode=0x8B000000 + rn:5 + rm:5 + rd:5

[headers]
format = elf
endianness = little

[props]
relocations = yes
pic = optional
