[meta]
name = windows-x86
protocol_version = 1
description = Windows x86_64 target templates

[target]
triple = x86_64-pc-windows-msvc
word_bits = 64
pointer_bits = 64
endianness = little

[abi]
stack_growth = down
return_register = rax
arg_registers = rcx,rdx,r8,r9

[sections]
default_section_order = text,rdata,data,bss

[encodings]
MOV_REG_IMM = opcode=0xB8 + reg:4 + imm:32_le
ADD_REG_REG = opcode=0x01 + modrm:{reg},{rm}

[headers]
format = pe
endianness = little

[props]
relocations = yes
pic = no
