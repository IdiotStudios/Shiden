[package]
name = "shiden"
version = "1.0.0"
edition = "2024"
description = "The Shiden Language"
license = "MIT"
repository = "https://github.com/idiotstudios/shiden"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.7"
object = { version = "0.30", features = ["write_core"] }
byteorder = "1.4"
tempfile = "3"
self_update = { version = "0.41", features = ["archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate"] }
reqwest = { version = "0.11", features = ["blocking", "json", "rustls-tls"], default-features = false }
semver = "1.0"
tar = "0.4"
flate2 = "1.0"

[build-dependencies]
which = "4"

[dev-dependencies]