name: Check Shiden and examples

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'examples/**'
      - 'rewrite/**'
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  shiden:
    runs-on: ubuntu-latest
    environment:
      name: check-shiden
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run cargo build
        run: cargo build --release

      - name: Run Shiden Brainfuck interpreter
        run: cargo run -- run examples/brainfuck
      
      - name: Run Shiden HTTP server
        run: cargo run -- http examples/http\ server
