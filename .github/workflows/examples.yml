name: Examples Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only one concurrent run of this workflow at a time
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm mingw-w64

      - name: Compile compiler
        run: sh ./compiler/compile.sh

      - name: Build examples
        run: |
          failed=""
          for example in examples/*; do
            if [ -d "$example" ]; then
              echo "Building $example..."
              if ! ./compiler/asm_output/shiden compile "$example"; then
                echo "Failed to build $example"
                failed="$failed $(basename "$example")"
              fi
            fi
          done
          if [ -n "$failed" ]; then
            echo "Failed examples:$failed"
            exit 1
          fi

      - name: Run examples
        run: |
          for example in examples/*; do
            if [ -d "$example" ]; then
              EXAMPLE_NAME=$(basename "$example")
              BINARY="$example/build/linux/$EXAMPLE_NAME"
              if [ -f "$BINARY" ]; then
                echo "Running $BINARY..."
                "$BINARY"
              fi
            fi
          done
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          choco install nasm -y
          choco install mingw -y

      - name: Compile compiler
        run: .\compiler\compile.ps1

      - name: Build examples
        shell: pwsh
        run: |
          $failed = @()
          foreach ($example in Get-ChildItem examples -Directory) {
            Write-Host "Building $($example.Name)..."
            & .\compiler\asm_output\shiden.exe compile $example.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Failed to build $($example.Name)" -ForegroundColor Red
              $failed += $example.Name
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host "Failed examples: $($failed -join ', ')" -ForegroundColor Red
            exit 1
          }

      - name: Run examples
        shell: pwsh
        run: |
          foreach ($example in Get-ChildItem examples -Directory) {
            $name = $example.Name
            $binary = "$($example.FullName)\build\windows\$name.exe"
            if (Test-Path $binary) {
              Write-Host "Running $binary..."
              & $binary
            }
          }
  # TODO: add windows-arm and linux-arm jobs once those targets are supported