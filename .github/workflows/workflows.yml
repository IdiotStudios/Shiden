name: Run all workflows on workflow change

on:
  push:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger other workflows
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = new Set([
              "check.yml",
              "check2.yml",
              "pages.yml",
              "release.yml",
            ]);
            const ref = context.ref_name;
            const { data } = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            for (const wf of data.workflows) {
              if (!workflows.has(wf.path.split("/").pop())) {
                continue;
              }
              core.info(`Dispatching ${wf.name} (${wf.id}) on ${ref}`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: wf.id,
                ref,
              });
            }
