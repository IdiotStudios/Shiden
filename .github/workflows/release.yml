name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: shiden
            asset_name: shiden-linux-x86_64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: shiden.exe
            asset_name: shiden-windows-x86_64.exe

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: shiden
            asset_name: shiden-linux-aarch64
            install: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: shiden
            asset_name: shiden-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: shiden
            asset_name: shiden-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install additional dependencies
        if: matrix.install
        run: ${{ matrix.install }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
          else
            cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
            chmod +x ${{ matrix.asset_name }}
          fi

      - name: Create checksum
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell -Command "(Get-FileHash -Path '${{ matrix.asset_name }}' -Algorithm SHA256).Hash | Out-File -FilePath '${{ matrix.asset_name }}.sha256' -Encoding ASCII -NoNewline"
          else
            shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
