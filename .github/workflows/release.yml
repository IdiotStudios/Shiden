name: Release Binaries

on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
  workflow_dispatch:

environment:
  name: release

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create tag if missing
        run: |
          git fetch --tags
          if ! git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            git tag ${{ steps.version.outputs.version }}
            git push origin ${{ steps.version.outputs.version }}
          fi
  build-release:
    name: Build Release (${{ matrix.target }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: shiden
            asset_name: shiden-linux-x86_64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: shiden.exe
            asset_name: shiden-windows-x86_64.exe

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: shiden
            asset_name: shiden-linux-aarch64
            install: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: shiden
            asset_name: shiden-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: shiden
            asset_name: shiden-macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install additional dependencies
        if: matrix.install
        run: ${{ matrix.install }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }} || true

      - name: Create checksum
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell -Command "(Get-FileHash -Path '${{ matrix.asset_name }}' -Algorithm SHA256).Hash | Out-File -FilePath '${{ matrix.asset_name }}.sha256' -Encoding ASCII -NoNewline"
          else
            shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
  publish-release:
    needs: [prepare-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-release.outputs.version }}
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}